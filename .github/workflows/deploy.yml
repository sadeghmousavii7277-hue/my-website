name: Build & Deploy Django App (Docker Hub)

on:
  push:
    branches:
      - main

jobs:
  # ==========================
  # 1️⃣ Build & Push Docker Image
  # ==========================
  build-and-push:
    runs-on: ubuntu-latest
    environment: production
    outputs:
      sha: ${{ steps.get_sha.outputs.commit_sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Get current commit SHA
        id: get_sha
        run: echo "commit_sha=${GITHUB_SHA}" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/mousavi:latest
            ${{ secrets.DOCKER_USERNAME }}/mousavi:${{ github.sha }}

  # ==========================
  # 2️⃣ Deploy on VPS
  # ==========================
  deploy-on-vps:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: SSH Login to VPS (check credentials)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          env:
            DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
            DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          script: |
            echo "Logging in to Docker Hub on VPS..."
            echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

      - name: Pull and Run Docker Image on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          env:
            DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
            GITHUB_SHA: ${{ needs.build-and-push.outputs.sha }}
          script: |
            echo "Pulling new image..."
            docker pull $DOCKER_USERNAME/mousavi:$GITHUB_SHA

            echo "Stopping old container..."
            docker stop mousavi || true
            docker rm mousavi || true

            echo "Running new container..."
            docker run -d \
              --name mousavi \
              --restart unless-stopped \
              -p 8000:8000 \
              -v /home/mousavi/static:/app/staticfiles \
              -v /home/mousavi/media:/app/media \
              $DOCKER_USERNAME/mousavi:$GITHUB_SHA

            echo "Cleaning up old images..."
            docker image prune -af --filter "until=24h"
