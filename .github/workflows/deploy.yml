name: Build & Deploy Django App (Docker Hub)

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    env:
      IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/mousavi

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup QEMU for cross-platform builds (optional)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 3️⃣ Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4️⃣ Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5️⃣ Build & Push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      # 6️⃣ Check Secrets (safe check, no sensitive data printed)
      - name: Check secrets (safe)
        run: |
          DOCKER_USERNAME="${{ secrets.DOCKER_USERNAME }}"
          DOCKER_PASSWORD="${{ secrets.DOCKER_PASSWORD }}"
          VPS_HOST="${{ secrets.VPS_HOST }}"
          VPS_USER="${{ secrets.VPS_USER }}"
          VPS_SSH_KEY="${{ secrets.VPS_SSH_KEY }}"

          echo "DOCKER_USERNAME length: ${#DOCKER_USERNAME}"
          echo "DOCKER_PASSWORD length: ${#DOCKER_PASSWORD}"
          echo "VPS_HOST length: ${#VPS_HOST}"
          echo "VPS_USER length: ${#VPS_USER}"
          echo "VPS_SSH_KEY length: ${#VPS_SSH_KEY}"
          echo "VPS_SSH_KEY first 20 chars: ${VPS_SSH_KEY:0:20}"
          echo "VPS_SSH_KEY last 20 chars: ${VPS_SSH_KEY: -20}"
      

      # 7️⃣ Setup SSH key for connecting to VPS
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Write private key safely
          printf "%s\n" "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 

      # 8️⃣ Deploy to VPS via SSH
      - name: Deploy to VPS
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -e
            IMAGE=${{ env.IMAGE_NAME }}:${{ github.sha }}

            echo "Pulling new image..."
            docker pull $IMAGE

            echo "Stopping old container..."
            docker stop mousavi || true
            docker rm mousavi || true

            echo "Running new container..."
            docker run -d \
              --name mousavi \
              --restart unless-stopped \
              -p 8000:8000 \
              -v /home/mousavi/static:/app/staticfiles \
              -v /home/mousavi/media:/app/media \
              $IMAGE

            echo "Cleaning up old images..."
            docker image prune -af --filter "until=24h"
          EOF

