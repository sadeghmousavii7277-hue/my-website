name: Build & Deploy Django App (Docker Hub)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      # 1️⃣ Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # 3️⃣ Check secrets availability
      - name: Check secrets availability
        run: |
          echo "DOCKER_USERNAME: ${DOCKER_USERNAME:+SET}"
          echo "DOCKER_PASSWORD: ${DOCKER_PASSWORD:+SET}"
          echo "VPS_HOST: ${VPS_HOST:+SET}"
          echo "VPS_USER: ${VPS_USER:+SET}"
          echo "VPS_PRIVATE_KEY: ${VPS_PRIVATE_KEY:+SET}"
          echo "SSH_PORT: ${SSH_PORT:+SET}"

      # 4️⃣ Docker Hub login
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5️⃣ Build & push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/mousavi:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/mousavi:latest

      # 6️⃣ Deploy to VPS
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            echo "✅ Connected to VPS: $(hostname)"
      
            # 1️⃣ Docker Hub login
            echo "Logging in to Docker Hub..."
            docker login -u "${{ secrets.DOCKER_USERNAME }}" -p "${{ secrets.DOCKER_PASSWORD }}"
      
            # 2️⃣ Pull latest image
            echo "Pulling new image..."
            docker pull ${{ secrets.DOCKER_USERNAME }}/mousavi:${{ github.sha }}
      
            # 3️⃣ Stop old container
            echo "Stopping old container..."
            docker stop mousavi || true
            docker rm mousavi || true
      
            # 4️⃣ Collect static inside a temporary container
            echo "Collecting static files..."
            docker run --rm \
              -v /home/mousavi/static:/app/staticfiles \
              -v /home/mousavi/media:/app/media \
              ${{ secrets.DOCKER_USERNAME }}/mousavi:${{ github.sha }} \
              python manage.py collectstatic --noinput
      
            # 4️⃣ Copy static from container to host folder for Nginx
            echo "Copying static files to host..."
            docker run --rm \
              -v /home/mousavi/static:/app/staticfiles \
              ${{ secrets.DOCKER_USERNAME }}/mousavi:${{ github.sha }} \
              /bin/bash -c "cp -r /app/staticfiles/. /app/staticfiles/"
      
            # 5️⃣ Run new container
            echo "Running new container..."
            docker run -d \
              --name mousavi \
              --restart unless-stopped \
              -p 8000:8000 \
              -v /home/mousavi/static:/app/staticfiles \
              -v /home/mousavi/media:/app/media \
              ${{ secrets.DOCKER_USERNAME }}/mousavi:${{ github.sha }}
            
            # 6️⃣ RELOAD NGINX - بارگذاری مجدد فایل‌های استاتیک
            echo "Reloading Nginx to serve new static files..."
            sudo systemctl reload nginx 
            # اگر reload کار نکرد از restart استفاده کنید: sudo systemctl restart nginx
            
            # 7️⃣ Clean old images
            echo "Cleaning up old images..."
            docker image prune -af --filter "until=24h"
