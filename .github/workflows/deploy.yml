name: Build & Deploy Django App (Docker Hub)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Check secrets availability
        run: |
          echo "DOCKER_USERNAME: ${DOCKER_USERNAME:+SET}"
          echo "DOCKER_PASSWORD: ${DOCKER_PASSWORD:+SET}"
          echo "VPS_HOST: ${VPS_HOST:+SET}"
          echo "VPS_USER: ${VPS_USER:+SET}"
          echo "VPS_PASSWORD: ${VPS_PASSWORD:+SET}"
          echo "SSH_PORT: ${SSH_PORT:+SET}"

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/mousavi:latest
            ${{ secrets.DOCKER_USERNAME }}/mousavi:${{ github.sha }}

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/mousavi:${{ github.sha }}
            docker stop mousavi || true
            docker rm mousavi || true
            docker run -d \
              --name mousavi \
              --restart unless-stopped \
              -p 8000:8000 \
              -v /home/mousavi/static:/app/staticfiles \
              -v /home/mousavi/media:/app/media \
              ${{ secrets.DOCKER_USERNAME }}/mousavi:${{ github.sha }}
            docker image prune -af --filter "until=24h"
