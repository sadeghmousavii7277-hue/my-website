<!-- templates/partials/_auth_modal.html -->
<style>
    /* Modal Base Styles */
    .auth-modal-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.6);
        z-index: 9999;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(5px);
        opacity: 0;
        transition: opacity 0.3s ease;
    }

    .auth-modal-overlay.active {
        display: flex;
        opacity: 1;
    }

    .auth-modal-container {
        background: #1a1a1a;
        width: 100%;
        max-width: 400px;
        border-radius: 15px;
        padding: 2rem;
        position: relative;
        transform: translateY(20px);
        transition: transform 0.3s ease;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        border: 1px solid #333;
        color: #fff;
        direction: rtl;
    }

    .auth-modal-overlay.active .auth-modal-container {
        transform: translateY(0);
    }

    .auth-modal-close {
        position: absolute;
        top: 15px;
        right: 15px;
        background: none;
        border: none;
        color: #888;
        font-size: 1.5rem;
        cursor: pointer;
        transition: color 0.2s;
    }

    .auth-modal-close:hover {
        color: #fff;
    }

    .auth-modal-title {
        font-size: 1.5rem;
        font-weight: bold;
        margin-bottom: 1.5rem;
        text-align: center;
        color: #f1c40f;
    }

    .auth-form-group {
        margin-bottom: 1rem;
        text-align: right;
    }

    .auth-form-group label {
        display: block;
        margin-bottom: 0.5rem;
        font-size: 0.9rem;
        color: #bbb;
    }

    .auth-form-input {
        width: 100%;
        padding: 0.75rem 1rem;
        background: #2a2a2a;
        border: 1px solid #444;
        border-radius: 8px;
        color: #fff;
        font-family: inherit;
        transition: border-color 0.2s;
        box-sizing: border-box;
    }

    .auth-form-input:focus {
        outline: none;
        border-color: #f1c40f;
    }

    .auth-btn {
        width: 100%;
        padding: 0.75rem;
        background: #f1c40f;
        color: #000;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
        margin-top: 1rem;
        transition: background 0.2s;
    }

    .auth-btn:hover {
        background: #d4ac0d;
    }

    .auth-switch-link {
        display: block;
        text-align: center;
        margin-top: 1rem;
        color: #888;
        font-size: 0.9rem;
        cursor: pointer;
        text-decoration: underline;
        transition: color 0.2s;
    }

    .auth-switch-link:hover {
        color: #f1c40f;
    }

    .auth-message {
        margin-top: 10px;
        text-align: center;
        font-size: 0.9rem;
        display: none;
    }

    .auth-message.error {
        color: #ff4757;
        display: block;
    }

    .auth-message.success {
        color: #2ed573;
        display: block;
    }
</style>

<div class="auth-modal-overlay" id="authModal">
    <div class="auth-modal-container">
        <button class="auth-modal-close" id="closeAuthModal">&times;</button>

        <!-- Login Form -->
        <div id="auth-login-view">
            <h2 class="auth-modal-title">ورود به حساب</h2>
            <form id="auth-login-form">
                <div class="auth-form-group">
                    <label>شماره موبایل</label>
                    <input type="text" class="auth-form-input" id="login-phone" required placeholder="09123456789">
                </div>
                <div class="auth-form-group">
                    <label>رمز عبور</label>
                    <input type="password" class="auth-form-input" id="login-password" required>
                </div>
                <div class="auth-message" id="login-message"></div>
                <button type="submit" class="auth-btn">ورود</button>
            </form>
            <span class="auth-switch-link" id="show-register">حساب ندارید؟ ثبت‌نام سریع</span>
        </div>

        <!-- Register Form -->
        <div id="auth-register-view" style="display: none;">
            <h2 class="auth-modal-title">ثبت‌نام سریع</h2>
            <form id="auth-register-form-actual">
                <div class="auth-form-group">
                    <label>نام و نام خانوادگی</label>
                    <input type="text" class="auth-form-input" id="register-name" required
                        placeholder="مثال: علی حسینی">
                </div>
                <div class="auth-form-group">
                    <label>شماره موبایل</label>
                    <input type="text" class="auth-form-input" id="register-phone" required placeholder="09123456789">
                </div>
                <div class="auth-form-group">
                    <label>رمز عبور</label>
                    <input type="password" class="auth-form-input" id="register-password" required>
                </div>
                <div class="auth-form-group">
                    <label>تکرار رمز عبور</label>
                    <input type="password" class="auth-form-input" id="register-password-confirm" required>
                </div>
                <div class="auth-message" id="register-message"></div>
                <button type="submit" class="auth-btn">تکمیل ثبت‌نام</button>
            </form>
            <span class="auth-switch-link" id="show-login">قبلاً ثبت‌نام کرده‌اید؟ ورود</span>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const modal = document.getElementById('authModal');
        const closeBtn = document.getElementById('closeAuthModal');

        // We will select all buttons that should trigger the modal
        const loginBtnTriggers = document.querySelectorAll('.trigger-auth-modal');

        const loginView = document.getElementById('auth-login-view');
        const registerView = document.getElementById('auth-register-view');
        const showRegister = document.getElementById('show-register');
        const showLogin = document.getElementById('show-login');

        // Get CSRF Token from Cookies
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        // Modal behavior
        window.openAuthModal = function (view = 'register') {
            if (!modal) return;
            if (view === 'register') {
                if (loginView) loginView.style.display = 'none';
                if (registerView) registerView.style.display = 'block';
            } else {
                if (loginView) loginView.style.display = 'block';
                if (registerView) registerView.style.display = 'none';
            }
            modal.classList.add('active');
        };

        function openModal(view = 'login') {
            window.openAuthModal(view);
        }

        function closeModal() {
            modal.classList.remove('active');
            setTimeout(() => {
                loginView.style.display = 'block';
                registerView.style.display = 'none';
            }, 300);
        }

        loginBtnTriggers.forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                openModal('login');
            });
        });

        const registerBtnTriggers = document.querySelectorAll('.trigger-register-modal');
        registerBtnTriggers.forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                openModal('register');
            });
        });

        if (closeBtn) closeBtn.addEventListener('click', closeModal);
        if (modal) {
            modal.addEventListener('click', (e) => {
                if (e.target === modal) closeModal();
            });
        }

        // Form Toggle
        if (showRegister) {
            showRegister.addEventListener('click', () => {
                loginView.style.display = 'none';
                registerView.style.display = 'block';
            });
        }

        if (showLogin) {
            showLogin.addEventListener('click', () => {
                registerView.style.display = 'none';
                loginView.style.display = 'block';
            });
        }

        // Handle Login
        const loginForm = document.getElementById('auth-login-form');
        if (loginForm) {
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const phone = document.getElementById('login-phone').value;
                const password = document.getElementById('login-password').value;
                const msgDiv = document.getElementById('login-message');

                msgDiv.className = 'auth-message';
                msgDiv.textContent = 'در حال بررسی...';
                msgDiv.classList.add('success');

                try {
                    const response = await fetch('/api/login/', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': getCookie('csrftoken') || ''
                        },
                        body: JSON.stringify({ phone, password })
                    });
                    const data = await response.json();

                    if (data.status === 'success') {
                        msgDiv.className = 'auth-message success';
                        msgDiv.textContent = data.message;
                        setTimeout(() => window.location.reload(), 500);
                    } else {
                        msgDiv.className = 'auth-message error';
                        msgDiv.textContent = data.message;
                    }
                } catch (err) {
                    msgDiv.className = 'auth-message error';
                    msgDiv.textContent = 'خطا در ارتباط با سرور';
                }
            });
        }

        // Handle Register
        const registerForm = document.getElementById('auth-register-form-actual');
        if (registerForm) {
            registerForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const name = document.getElementById('register-name').value;
                const phone = document.getElementById('register-phone').value;
                const password = document.getElementById('register-password').value;
                const passwordConfirm = document.getElementById('register-password-confirm').value;
                const msgDiv = document.getElementById('register-message');

                if (password !== passwordConfirm) {
                    msgDiv.className = 'auth-message error';
                    msgDiv.textContent = 'رمز عبور و تکرار آن مطابقت ندارند';
                    return;
                }

                msgDiv.className = 'auth-message';
                msgDiv.textContent = 'در حال ثبت نام...';
                msgDiv.classList.add('success');

                try {
                    const response = await fetch('/api/register/', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': getCookie('csrftoken') || ''
                        },
                        body: JSON.stringify({ name, phone, password })
                    });
                    const data = await response.json();

                    if (data.status === 'success') {
                        msgDiv.className = 'auth-message success';
                        msgDiv.textContent = data.message;
                        setTimeout(() => window.location.reload(), 500);
                    } else {
                        msgDiv.className = 'auth-message error';
                        msgDiv.textContent = data.message;
                    }
                } catch (err) {
                    msgDiv.className = 'auth-message error';
                    msgDiv.textContent = 'خطا در ارتباط با سرور';
                }
            });
        }
    });
</script>
