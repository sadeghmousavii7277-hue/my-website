server {
    listen 80;
    server_name moosavi-academy.ir www.moosavi-academy.ir;

    # سرو فایل‌های استاتیک
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # تاییدیه اینماد - سرو مستقیم بدون نیاز به Django
    location = /18634421.txt {
        add_header Content-Type "text/plain; charset=utf-8";
        return 200 "18634421";
    }

    # سرو فایل‌های مدیا (تصاویر آپلودی)
    location /media/ {
        alias /home/mousavi/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # پراکسی درخواست‌ها به Gunicorn
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
