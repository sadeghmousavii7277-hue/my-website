server {
    listen 80;
    server_name 87.98.149.121;  # یا آدرس IP یا دامنه شما

    location /static/ {
        alias /app/staticfiles/;  # مسیر استاتیک‌ها داخل کانتینر
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location /media/ {
        alias /app/media/;  # مسیر مدیا داخل کانتینر
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        proxy_pass http://web:8000;  # پروکسی به سرویس web (Django)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
