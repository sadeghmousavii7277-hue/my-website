{% load humanize %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>قیمت‌های لحظه‌ای</title>
    <style>
        body {background:#0f172a;color:#fff;font-family:Vazirmatn, sans-serif;direction:rtl;}
        .box{max-width:900px;margin:40px auto;padding:20px;background:#1e293b;border-radius:16px;}
        .item{background:#334155;padding:12px;border-radius:12px;margin:8px 0;}
        .name{font-size:16px;color:#94a3b8;}
        .price{font-size:20px;font-weight:700;}
        .unit{font-size:13px;color:#cbd5e1;}
    </style>
</head>
<body>
<div class="box">
    <h2>💰 قیمت‌های لحظه‌ای بازار</h2>
    {% for p in prices %}
      <div class="item">
        <div class="name">{{ p.name }}</div>
        <div class="price">
          {{ p.price|intcomma }} 
          <span class="unit">{{ p.unit }}</span>
        </div>
      </div>
    {% empty %}
      <p>داده‌ای برای نمایش وجود ندارد.</p>
    {% endfor %}
</div>
</body>
</html>
<script>
async function loadCryptoData() {
  const response = await fetch("https://api.ompfinex.com/v1/tickers");
  const data = await response.json();

  const markets = ["USDTIRT", "BTCIRT", "ETHIRT", "DOGEIRT", "XRPIRT"];
  const tbody = document.querySelector("#crypto-tbody");
  tbody.innerHTML = "";

  markets.forEach(symbol => {
    const coin = data.find(c => c.symbol === symbol);
    if (!coin) return;

    const price = Number(coin.last).toLocaleString('fa-IR');
    const change = parseFloat(coin.percentChange);
    const changeColor = change >= 0 ? "text-green-400" : "text-red-400";

    tbody.innerHTML += `
      <tr class="border-b border-gray-800 hover:bg-gray-800 transition text-center">
        <td class="py-3 text-gray-200 font-bold">${symbol.replace("IRT","")}</td>
        <td class="py-3 font-bold text-green-400">${price}</td>
        <td class="py-3 font-semibold text-gray-300">$—</td>
        <td class="py-3 ${changeColor} font-semibold">${change.toFixed(2)}%</td>
      </tr>
    `;
  });
}

loadCryptoData();
setInterval(loadCryptoData, 300000); // هر ۵ دقیقه آپدیت
</script>
